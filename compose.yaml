# PostgreSQL for local runs, and the app itself for a demo. Ports are published on localhost only.
name: bank-core

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      # 5434 by default, since 5432 and 5433 are often taken; the app reads BANK_DB_PORT too.
      - "127.0.0.1:${BANK_DB_PORT:-5434}:5432"
    volumes:
      - bank-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    image: bank-core:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bank
      SPRING_PROFILES_ACTIVE: demo
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # JSON logs for ELK (Project 3)
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  bank-db:
