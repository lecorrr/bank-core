bank:
  code: "399999"   # bank code (MFO) in our IBANs; other codes go to other banks via bank-integration

spring:
  application:
    name: bank-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${BANK_DB_PORT:5434}/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
    hikari:
      connection-init-sql: SET lock_timeout TO '5s'   # a long lock wait fails the request instead of hanging
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  kafka:
    # bank-core also runs without Kafka: outgoing events wait in the outbox, incoming ones on the topic.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer   # Spring Modulith sends JSON bytes
    consumer:
      auto-offset-reset: earliest
      properties:
        reconnect.backoff.max.ms: 30000   # without Kafka, one warning every 30 s instead of a flood
  modulith:
    events:
      completion-mode: delete   # event_publication holds only events not yet in Kafka
      republish-outstanding-events-on-restart: true
      # Unfinished events become FAILED after this and are resent. Longer than a Kafka send can take
      # (delivery.timeout.ms is 2 minutes), so an event still in flight is never sent twice.
      staleness:
        published: 2m
        processing: 5m
        resubmitted: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    url: /openapi/bank-core.yaml   # the hand-written contract, not one generated from the code

logging:
  level:
    dev.tkachuk.bank: INFO
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.producer.ProducerConfig: WARN
  pattern:
    correlation: "[%X{requestId:-}] "   # request id from RequestIdFilter on every console line
